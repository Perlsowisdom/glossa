name: Release

# Two ways to start it (docs/releasing.md):
#   - Push a version tag:   git tag v1.2.3 && git push origin v1.2.3     (makes a DRAFT release)
#   - Press the button:     Actions > Release > Run workflow > version, kind
# Either way it builds the Windows setup (NSIS), the Microsoft Store package (MSIX) and the macOS
# disk image (DMG: not signed by Apple, only ad-hoc signed), signs the update with GLOSSA_UPDATE_KEY
# (skipped, with a warning, while internal/update/pubkey.txt is the placeholder), and makes the
# GitHub Release. Nothing is public until a release is published.
#
# Jobs: prepare (version, kind, commit) -> windows and macos in parallel -> release (checksums,
# latest.json, tag, GitHub Release). If either build fails, no tag and no release are made.
#
# latest.json is made for every kind of release, pre-releases and drafts included (once the key is
# real). The Stable channel reads the one on the newest full release (releases/latest); the Preview
# channel reads the newest non-draft release that has one (docs/releasing.md, Channels).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v: 1.2.3 or 0.4.0-alpha"
        required: true
        type: string
      kind:
        description: "What to create. auto: a pre-release if the version has a - suffix, otherwise a draft"
        required: true
        type: choice
        default: auto
        options: [auto, draft, prerelease, release]
      commit:
        description: "Commit or branch to release (empty: the commit this run was started on)"
        required: false
        type: string
      notes:
        description: "A sentence or two for the update notice in the app (empty: none). The release page has its own notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  # Decides the version, the kind of release and the exact commit once, so both builds and the
  # release itself use the same ones.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      kind: ${{ steps.ver.outputs.kind }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || '' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version, tag and kind
        id: ver
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if ($env:EVENT -eq 'workflow_dispatch') {
            $v = $env:INPUT_VERSION.Trim() -replace '^v', ''
            $kind = $env:INPUT_KIND
          } else {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "The tag $env:GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" }
            $v = ./scripts/version.ps1 -Ref $env:GITHUB_REF_NAME
            $kind = 'draft'
          }
          ./scripts/version-map.ps1 validate $v | Out-Null   # fails unless MAJOR.MINOR.PATCH[-suffix]
          $pre = $v.Contains('-')
          if ($kind -eq 'auto') { $kind = if ($pre) { 'prerelease' } else { 'draft' } }
          if ($kind -eq 'release' -and $pre) { throw "$v has a - suffix, so it can only be a draft or a pre-release. Run it again with kind prerelease (or a version without the suffix)." }
          if ($env:EVENT -eq 'workflow_dispatch') {
            git fetch --tags --quiet
            if (git tag --list "v$v") { throw "The tag v$v already exists. Choose a new version, or delete the tag first." }
          }
          $sha = git rev-parse HEAD
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $v as $kind from $sha"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...
          go test -tags store ./internal/update/...
          cd tools
          go vet ./...
          go test ./...

      - name: Update key check
        shell: pwsh
        run: |
          if (Select-String -Path internal/update/pubkey.txt -Pattern PLACEHOLDER -Quiet) {
            Write-Host "::warning::internal/update/pubkey.txt is still the placeholder. This release will NOT be signed and has no latest.json, so no app offers it as an update, until a real key is committed (docs/releasing.md)."
          }

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build the setup (NSIS)
        shell: pwsh
        run: ./scripts/package-nsis.ps1 -Version ${{ needs.prepare.outputs.version }}

      - name: Try the setup
        shell: pwsh
        run: |
          $setup = "build/bin/Glossa-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'glossa-try'
          Start-Process (Resolve-Path $setup) -ArgumentList '/S', "/D=$dir" -Wait
          foreach ($f in 'Glossa.exe', 'Uninstall.exe', 'LICENSE-MIT', 'LICENSE-APACHE') {
            if (-not (Test-Path "$dir/$f")) { throw "The setup did not install $f" }
          }
          Start-Process "$dir/Uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait
          if (Test-Path "$dir/Glossa.exe") { throw 'The uninstaller left Glossa.exe behind' }

      - name: Build the Store package (MSIX)
        shell: pwsh
        env:
          GLOSSA_MSIX_IDENTITY: ${{ vars.GLOSSA_MSIX_IDENTITY || vars.XEGESIS_MSIX_IDENTITY }}
          GLOSSA_MSIX_PUBLISHER: ${{ vars.GLOSSA_MSIX_PUBLISHER || vars.XEGESIS_MSIX_PUBLISHER }}
          GLOSSA_MSIX_PUBLISHER_DISPLAY: ${{ vars.GLOSSA_MSIX_PUBLISHER_DISPLAY || vars.XEGESIS_MSIX_PUBLISHER_DISPLAY }}
        run: ./scripts/package-msix.ps1 -Version ${{ needs.prepare.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: |
            build/bin/Glossa-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
            build/bin/Glossa-${{ needs.prepare.outputs.version }}-windows-x64.msix
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      # Tests that only make sense on Windows carry build tags or runtime checks, so they are
      # skipped here.
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...
          go test -tags store ./internal/update/...
          cd tools
          go vet ./...
          go test ./...

      - name: Build the app and the disk image
        run: bash ./scripts/package-macos.sh ${{ needs.prepare.outputs.version }}

      - name: Check the disk image
        run: |
          mac="$(cd tools && go run ./versionmap mac ${{ needs.prepare.outputs.version }})"
          bash ./scripts/check-macos.sh "build/bin/Glossa-${{ needs.prepare.outputs.version }}-macos-universal.dmg" "$mac"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-files
          path: build/bin/Glossa-${{ needs.prepare.outputs.version }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    # Both builds passed: checksums, signature and latest.json cover all three files, then the tag
    # (button runs) and the GitHub Release are made.
    needs: [prepare, windows, macos]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The old secret and variable names (Xegesis) still work until they are renamed.
      GLOSSA_UPDATE_KEY: ${{ secrets.GLOSSA_UPDATE_KEY || secrets.XEGESIS_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: windows-files
          path: dl/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-files
          path: dl/macos

      - name: Checksums, signature and latest.json
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        run: >
          ./scripts/release-files.ps1 -Version ${{ needs.prepare.outputs.version }}
          -Setup "dl/windows/Glossa-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          -Msix "dl/windows/Glossa-${{ needs.prepare.outputs.version }}-windows-x64.msix"
          -Mac "dl/macos/Glossa-${{ needs.prepare.outputs.version }}-macos-universal.dmg"

      - name: Check latest.json is there (every kind of release, so the Preview channel can find it)
        shell: pwsh
        run: |
          $real = -not (Select-String -Path internal/update/pubkey.txt -Pattern PLACEHOLDER -Quiet)
          $file = 'build/release/latest.json'
          if ($real -and $env:GLOSSA_UPDATE_KEY -and -not (Test-Path $file)) { throw 'The key is real but no latest.json was made; the release would not be offered as an update.' }
          if (Test-Path $file) {
            $m = Get-Content -Raw $file | ConvertFrom-Json
            if ($m.version -ne '${{ needs.prepare.outputs.version }}') { throw "latest.json says version $($m.version), not ${{ needs.prepare.outputs.version }}" }
            Write-Host "latest.json for ${{ needs.prepare.outputs.version }} goes into the ${{ needs.prepare.outputs.kind }} release."
          }

      - name: Tag the commit (button runs only)
        if: github.event_name == 'workflow_dispatch'
        id: tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${{ needs.prepare.outputs.tag }}" -m "Glossa ${{ needs.prepare.outputs.version }}" HEAD
          git push origin "refs/tags/${{ needs.prepare.outputs.tag }}"
          if ($LASTEXITCODE) { throw 'pushing the tag failed' }
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--verify-tag', '--generate-notes', '--title', "Glossa ${{ needs.prepare.outputs.version }}")
          switch ('${{ needs.prepare.outputs.kind }}') {
            'draft' { $flags += '--draft' }
            'prerelease' { $flags += '--prerelease' }
          }
          # A draft of a suffixed version is also marked as a pre-release, for when it is published.
          if ('${{ needs.prepare.outputs.kind }}' -eq 'draft' -and '${{ needs.prepare.outputs.prerelease }}' -eq 'True') { $flags += '--prerelease' }
          $files = Get-ChildItem build/release | ForEach-Object { $_.FullName }
          gh release create '${{ needs.prepare.outputs.tag }}' @flags @files
          if ($LASTEXITCODE) { throw 'gh release create failed' }

      - name: Remove the tag again if the release failed
        if: failure() && steps.tag.outputs.created == 'true'
        shell: pwsh
        run: git push origin ":refs/tags/${{ needs.prepare.outputs.tag }}"
