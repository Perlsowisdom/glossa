name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Build tools tests
        run: cd tools && go test ./...
      - name: Build CLI
        run: go build ./cmd/glossa
      - name: Build desktop app
        if: runner.os != 'macOS'
        shell: bash
        run: |
          tags=desktop,production
          if [ "$RUNNER_OS" = Linux ]; then tags=$tags,webkit2_41; fi
          go build -tags "$tags" -o glossa-desktop ./app
      # The macOS app the release ships: a universal (arm64 + x86_64) Glossa.app, ad-hoc signed, in a
      # disk image, then checked (contents, signature, and that the binary starts). Same scripts as
      # the release workflow; the frontend is the committed build in frontend/dist.
      - name: Build the macOS app and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash ./scripts/package-macos.sh
          dmg="$(ls build/bin/Glossa-*-macos-universal.dmg)"
          bash ./scripts/check-macos.sh "$dmg" 0.0.0

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The built files are committed (the Go app embeds them); a change to src/ must come with a rebuild.
      - name: Built files are up to date
        run: git diff --exit-code -- frontend/dist || echo "::warning::frontend/dist differs from a fresh build"

  windows-release:
    # What the release workflow needs, checked on every change: the Microsoft Store build (no updater),
    # the build tools, the signing tool and the MSIX manifest. The real-app tests stay local: they
    # need a desktop session.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Store build has no updater
        run: |
          go vet -tags desktop,production,store ./app ./internal/update/...
          go test -tags store ./internal/update/...
      - name: Build tools
        working-directory: tools
        run: go vet ./...
      - name: MSIX manifest
        shell: pwsh
        run: ./scripts/package-msix.ps1 -ManifestOnly -Version 0.0.1

  linux-package:
    # The Linux packages the release ships, built and checked on every change: the .deb (its fields and
    # files, that it installs with its dependencies, that the launcher file is valid, that the app opens
    # on a virtual screen and reports its version, and that it removes cleanly) and the .tar.gz. Same
    # scripts and the same runner as the release workflow; the frontend is the committed build in
    # frontend/dist.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb desktop-file-utils
      - name: Build the packages
        run: bash ./scripts/package-linux.sh 0.0.0-ci
      - name: Check the .deb
        run: bash ./scripts/check-linux.sh build/bin/Glossa-0.0.0-ci-linux-amd64.deb 0.0.0-ci
      - name: Check the .tar.gz
        run: |
          tar -tzf build/bin/Glossa-0.0.0-ci-linux-amd64.tar.gz | sort > files.txt
          cat files.txt
          for f in glossa glossa.png README-linux.txt LICENSE-MIT LICENSE-APACHE io.github.perlsowisdom.glossa.desktop; do
            grep -qx "Glossa-0.0.0-ci-linux-amd64/$f" files.txt
          done
